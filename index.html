<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一周吃什么：记录想吃的餐食，安排周菜单，并回看饮食历史。">
  <title>一周吃什么</title>
  <style>
    :root { --paper:#fff9f1; --surface:#fff; --soft:#f8ecde; --ink:#302824; --muted:#796b61; --line:#ead9c8; --primary:#a8462f; --green:#58745d; --shadow:0 14px 36px rgba(92,61,37,.12); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--paper); }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); } button,input { font:inherit } button { cursor:pointer }
    .app { min-height:100vh; } .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; padding:14px max(18px,calc((100vw - 1180px)/2)); border-bottom:1px solid var(--line); background:rgba(255,249,241,.95); backdrop-filter:blur(12px); }
    .brand { display:flex; align-items:center; gap:9px; font-weight:750; white-space:nowrap } .mark { display:grid; place-items:center; width:31px; height:31px; border-radius:10px; background:var(--primary); color:white; font-size:18px }
    .nav { display:flex; gap:3px; flex:1; } .nav button { border:0; border-radius:8px; background:transparent; padding:8px 10px; color:var(--muted); } .nav button.active { background:var(--soft); color:var(--ink); font-weight:650 }
    .space { position:relative } .space button { border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:7px 10px; color:var(--ink); font-size:13px } .badge { margin-left:5px; color:var(--primary); font-size:11px }
    .wrap { max-width:1180px; margin:0 auto; padding:28px 18px 52px; } .view { display:none } .view.active { display:block }
    .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:20px } .eyebrow { margin:0 0 5px; color:var(--muted); font-size:12px; letter-spacing:.06em } h1 { margin:0; font-size:30px; letter-spacing:-.04em } .sub { margin:7px 0 0; color:var(--muted); font-size:14px }
    .actions { display:flex; flex-wrap:wrap; gap:8px } .btn { min-height:37px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:0 11px; font-size:13px } .btn.primary { border-color:var(--primary); background:var(--primary); color:#fff } .btn.danger { color:var(--primary) }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:18px } .panel { border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow) }
    .week { display:grid; grid-template-columns:64px repeat(7,minmax(96px,1fr)); overflow:auto; } .date,.label,.slot { min-height:87px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px } .week > :nth-child(8n) { border-right:0 } .week > :nth-last-child(-n+8) { border-bottom:0 }
    .date { min-height:53px; color:var(--muted); font-size:12px; font-weight:650 } .date strong { display:block; margin-top:4px; color:var(--ink); font-size:15px }.date.today { background:#fff2e8 }.label { display:grid; place-items:center; color:var(--muted); font-size:13px }.slot { display:flex; align-content:flex-start; flex-wrap:wrap; gap:5px; }
    .chip { border:0; border-radius:7px; background:var(--soft); color:var(--ink); padding:6px 8px; font-size:12px; text-align:left }.chip.mode { background:#e8f0e9; color:var(--green) }.add { width:100%; border:1px dashed var(--line); border-radius:7px; background:transparent; color:var(--muted); padding:5px 7px; font-size:12px; text-align:left }
    .side { padding:16px }.side h2 { margin:0; font-size:16px }.side p { margin:7px 0 13px; color:var(--muted); font-size:12px; line-height:1.5 }.wish { display:grid; gap:7px }.wish-row { display:flex; align-items:center; justify-content:space-between; gap:7px; border:1px solid var(--line); border-radius:9px; padding:8px; font-size:13px }.wish-row button { border:0; background:transparent; color:var(--primary); font-size:12px }.notice { min-height:20px; margin-top:12px; color:var(--green); font-size:12px }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px } .section-head h2 { margin:0; font-size:19px }.search { width:100%; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:11px 12px; color:var(--ink); outline-color:var(--primary) }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:12px; margin-top:15px }.recipe { width:100%; min-height:112px; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--ink); padding:14px; text-align:left }.recipe:hover { border-color:var(--primary) }.recipe small { display:block; margin-top:9px; color:var(--muted) }.tag { display:inline-block; margin-top:9px; color:var(--green); font-size:11px }
    .history { display:grid; gap:10px }.history-row { display:flex; align-items:center; justify-content:space-between; gap:14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:13px 15px }.history-row strong { font-size:14px }.history-row span { display:block; margin-top:4px; color:var(--muted); font-size:12px }.empty { padding:34px 10px; color:var(--muted); text-align:center }
    .modal { position:fixed; z-index:20; inset:0; display:none; place-items:center; padding:18px; background:rgba(49,35,25,.34) }.modal.show { display:grid }.dialog { width:min(540px,100%); max-height:88vh; overflow:auto; border-radius:17px; background:var(--surface); box-shadow:0 22px 60px rgba(0,0,0,.22); padding:22px }.dialog-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start }.dialog h2 { margin:0; font-size:21px }.close { border:0; background:transparent; color:var(--muted) }.result { display:flex; align-items:center; justify-content:space-between; width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; padding:12px 4px; color:var(--ink); text-align:left }.result small { color:var(--muted) }.result:last-child { border-bottom:0 }.ingredient { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px }.ingredient span:last-child { color:var(--muted); text-align:right }.steps { padding-left:20px; line-height:1.65 }.steps li { padding:5px 0 }.share-code { border:1px dashed var(--primary); border-radius:11px; background:var(--soft); color:var(--primary); padding:14px; font:700 19px ui-monospace,monospace; letter-spacing:.08em }
    .muted { color:var(--muted); font-size:13px; line-height:1.55 }.demo { margin-top:15px; padding:10px; border-radius:9px; background:#fff3e8; color:#7a4b38; font-size:12px; line-height:1.5 }
    @media(max-width:780px){ .top { padding:12px 14px; gap:9px }.brand { font-size:0 }.mark { width:32px;height:32px }.nav { overflow:auto }.nav button { white-space:nowrap; padding:8px }.space button { max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }.wrap { padding:20px 14px 42px }.heading { align-items:flex-start; flex-direction:column }h1{font-size:25px}.layout{grid-template-columns:1fr}.side{display:none}.week{grid-template-columns:55px repeat(7,98px)}.date,.label,.slot{min-height:76px}.cards{grid-template-columns:1fr 1fr}.actions{width:100%}.btn{flex:1;padding:0 8px} }
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand"><span class="mark">🍚</span>一周吃什么</div><nav class="nav" aria-label="主导航"><button class="active" data-tab="week">本周</button><button data-tab="want">想吃</button><button data-tab="library">餐食库</button><button data-tab="history">历史</button></nav><div class="space"><button id="shareButton">我的餐食空间 <span class="badge">测试版</span></button></div></header>
    <main class="wrap">
      <section class="view active" id="week"><div class="heading"><div><p class="eyebrow" id="weekLabel"></p><h1>本周吃什么</h1><p class="sub" id="weekRange"></p></div><div class="actions"><button class="btn" id="copyWeek">复制上周</button><button class="btn danger" id="clearWeek">一键清空</button><button class="btn primary" id="addMeal">＋ 添加餐食</button></div></div><div class="layout"><div class="panel"><div class="week" id="weekGrid"></div><div class="notice" id="notice"></div></div><aside class="panel side"><h2>想吃</h2><p>先收好想法，周日再安排。</p><div class="wish" id="weekWishes"></div><button class="btn" style="width:100%;margin-top:12px" data-tab="want">查看想吃清单</button><div class="demo">当前为可操作的体验版。菜单会保存在这台设备的浏览器中；正式版将接入账户、云端历史和实时共享。</div></aside></div></section>
      <section class="view" id="want"><div class="heading"><div><p class="eyebrow">随手记录</p><h1>想吃</h1><p class="sub">不需要当场决定哪一天吃。</p></div><button class="btn primary" id="saveWant">＋ 记录想吃的</button></div><div class="panel" style="padding:18px"><input class="search" id="wantSearch" placeholder="搜索菜名，例如：宫保"><div class="cards" id="wantCards"></div></div></section>
      <section class="view" id="library"><div class="heading"><div><p class="eyebrow">餐食库</p><h1>找一道想吃的</h1><p class="sub">食谱有明确食材与步骤；火锅、烧烤等可直接安排。</p></div></div><input class="search" id="librarySearch" placeholder="输入菜名、类别或关键词"><div class="cards" id="libraryCards"></div></section>
      <section class="view" id="history"><div class="heading"><div><p class="eyebrow">最终记录</p><h1>历史</h1><p class="sub">过去周菜单会被保留，不会被新周覆盖。</p></div></div><div class="history" id="historyList"></div></section>
    </main>
  </div>
  <div class="modal" id="pickerModal"><div class="dialog"><div class="dialog-head"><div><h2 id="pickerTitle">添加餐食</h2><p class="muted">选择后会立即写入对应餐格。</p></div><button class="close" data-close>关闭</button></div><input class="search" id="pickerSearch" placeholder="输入菜名，例如：宫保"><div id="pickerResults"></div></div></div>
  <div class="modal" id="recipeModal"><div class="dialog" id="recipeDetail"></div></div>
  <div class="modal" id="shareModal"><div class="dialog"><div class="dialog-head"><div><h2>邀请成员</h2><p class="muted">正式版中，对方登录并输入邀请码后才能加入你的共享空间。</p></div><button class="close" data-close>关闭</button></div><div class="share-code">EAT-7K9M</div><button class="btn primary" id="copyCode" style="margin-top:12px">复制邀请码</button><p class="muted">邀请码绑定一个餐食空间，不会公开其他人的菜单或历史。</p></div></div>
  <script>
    const recipes=[
      {id:'gongbao',name:'宫保鸡丁',aliases:'宫保 鸡丁 鸡腿肉',kind:'荤菜',out:'一盘',ingredients:[['去骨鸡腿肉','300 g，切 1.5 厘米小丁'],['黄瓜','100 g，切丁'],['熟花生','40 g'],['生抽','10 ml'],['料酒','10 ml'],['玉米淀粉','5 g'],['食用油','15 ml']],steps:['将鸡腿肉和生抽、料酒、淀粉抓匀，静置 10 分钟。','锅烧热后下油，鸡丁中大火炒至变色，盛出。','下配料炒香，加入黄瓜和鸡丁快速翻炒。','加入花生，翻匀后出锅。']},
      {id:'youmaicai',name:'蒜蓉油麦菜',aliases:'油麦菜 蒜蓉 青菜',kind:'素菜',out:'一盘',ingredients:[['油麦菜','350 g，洗净切段'],['蒜','15 g，切末'],['食用油','15 ml'],['盐','2 g']],steps:['锅烧热后下油，放入蒜末炒出香味。','放入油麦菜，大火快速翻炒。','加入盐，菜叶变软后立即出锅。']},
      {id:'tomatoegg',name:'番茄炒蛋',aliases:'西红柿 番茄 鸡蛋',kind:'蛋类',out:'一盘',ingredients:[['番茄','300 g，切块'],['鸡蛋','3 个，打散'],['食用油','20 ml'],['盐','3 g']],steps:['锅热后下油，倒入蛋液炒至凝固，盛出。','下番茄炒出汁水。','放回鸡蛋，加盐炒匀后出锅。']},
      {id:'scallop',name:'蒜蓉粉丝蒸扇贝',aliases:'扇贝 粉丝 蒜蓉 海鲜',kind:'海鲜',out:'一盘',ingredients:[['扇贝','6 个，清理干净'],['粉丝','50 g，泡软'],['蒜','25 g，切末'],['生抽','15 ml'],['食用油','20 ml']],steps:['粉丝泡软后铺在扇贝上。','蒜末用油炒香，加入生抽后铺在粉丝上。','水开后入锅蒸 6 分钟，关火焖 1 分钟。']},
      {id:'noodle',name:'汤面',aliases:'面条 汤面 主食',kind:'面食',out:'一份',ingredients:[['鲜面条','200 g'],['青菜','100 g'],['鸡蛋','1 个'],['高汤或清水','500 ml'],['盐','2 g']],steps:['汤底煮开，加入盐。','放入面条煮至八成熟。','加入青菜和鸡蛋，煮熟后盛出。']},
      {id:'congee',name:'皮蛋瘦肉粥',aliases:'粥 皮蛋 瘦肉',kind:'粥',out:'一份',ingredients:[['大米','80 g'],['瘦肉','80 g，切丝'],['皮蛋','1 个，切丁'],['清水','900 ml'],['盐','2 g']],steps:['大米加水煮至软烂。','加入瘦肉丝煮熟。','加入皮蛋和盐，煮 2 分钟后关火。']},
      {id:'countryegg',name:'乡村炒蛋',aliases:'乡村 炒蛋 鸡蛋',kind:'蛋类',out:'一盘',ingredients:[['鸡蛋','4 个'],['青椒','120 g，切段'],['蒜','10 g，切片'],['食用油','20 ml'],['盐','3 g']],steps:['鸡蛋打散，先炒至凝固后盛出。','下蒜和青椒炒香。','倒回鸡蛋，加盐翻匀后出锅。']},
      {id:'hotpot',name:'火锅',aliases:'火锅 涮锅',kind:'用餐方式',mode:true},
      {id:'barbecue',name:'烧烤',aliases:'烧烤 烤肉',kind:'用餐方式',mode:true}
    ];
    const key='yizhou-chi-v1'; let data=JSON.parse(localStorage.getItem(key)||'{}'); data.plans??={}; data.wants??=[]; let currentWeek=monday(new Date()), activeSlot=null, undoPlan=null;
    function monday(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)} function save(){localStorage.setItem(key,JSON.stringify(data))} function plan(){return data.plans[currentWeek]??(data.plans[currentWeek]={})} function slotKey(date,type){return date+'-'+type} function dateName(date){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(date+'T00:00:00'))}
    function notify(t){document.querySelector('#notice').textContent=t;setTimeout(()=>document.querySelector('#notice').textContent='',3000)} function find(id){return recipes.find(x=>x.id===id)}
    function days(){return Array.from({length:7},(_,i)=>{const d=new Date(currentWeek+'T00:00:00');d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)})}
    function renderWeek(){const g=document.querySelector('#weekGrid');const ds=days();document.querySelector('#weekLabel').textContent=currentWeek.slice(0,4)+' 年 '+dateName(currentWeek)+' 所在周';document.querySelector('#weekRange').textContent=dateName(ds[0])+' — '+dateName(ds[6]);let html='<div class="date"></div>'+ds.map((d,i)=>'<div class="date '+(d===new Date().toISOString().slice(0,10)?'today':'')+'">周'+['一','二','三','四','五','六','日'][i]+'<strong>'+d.slice(8)+'</strong></div>').join('');['午餐','晚餐'].forEach(type=>{html+='<div class="label">'+type+'</div>'+ds.map(d=>{const items=plan()[slotKey(d,type)]||[];return '<div class="slot" data-date="'+d+'" data-type="'+type+'">'+items.map(id=>{const r=find(id);return '<button class="chip '+(r.mode?'mode':'')+'" data-recipe="'+id+'">'+r.name+'</button>'}).join('')+'<button class="add" data-add="1">＋ 添加</button></div>'}).join('')});g.innerHTML=html;g.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{const s=e.target.closest('.slot');activeSlot={date:s.dataset.date,type:s.dataset.type};openPicker()});g.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>openRecipe(find(b.dataset.recipe)));renderWeekWishes()}
    function renderWeekWishes(){const el=document.querySelector('#weekWishes');el.innerHTML=data.wants.length?data.wants.slice(0,4).map(id=>'<div class="wish-row"><span>'+find(id).name+'</span><button data-wish="'+id+'">安排</button></div>').join(''):'<p class="muted">还没有保存想吃的菜。</p>';el.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{activeSlot={date:days()[2],type:'晚餐'};openPicker(b.dataset.wish)})}
    function filter(q){q=q.trim().toLowerCase();return recipes.filter(r=>!q||[r.name,r.aliases,r.kind].join(' ').toLowerCase().includes(q))} function openPicker(preselect){document.querySelector('#pickerModal').classList.add('show');const input=document.querySelector('#pickerSearch');input.value='';renderPicker(filter(''));input.focus();if(preselect){addToSlot(preselect)}} function renderPicker(list){document.querySelector('#pickerResults').innerHTML=list.map(r=>'<button class="result" data-pick="'+r.id+'"><span>'+r.name+'</span><small>'+r.kind+(r.mode?' · 可直接安排':'')+'</small></button>').join('')||'<p class="empty">没有匹配结果。可先保存为待补全。</p>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>addToSlot(b.dataset.pick))} function addToSlot(id){if(!activeSlot)return;const p=plan(),k=slotKey(activeSlot.date,activeSlot.type);p[k]??=[];if(!p[k].includes(id))p[k].push(id);data.wants=data.wants.filter(x=>x!==id);save();closeModals();renderWeek();notify('已加入 '+dateName(activeSlot.date)+activeSlot.type+'。')}
    function openRecipe(r){if(r.mode){document.querySelector('#recipeDetail').innerHTML='<div class="dialog-head"><div><h2>'+r.name+'</h2><p class="muted">这是一种用餐方式，直接记录和安排即可，无需食谱。</p></div><button class="close" data-close>关闭</button></div>'; }else{document.querySelector('#recipeDetail').innerHTML='<div class="dialog-head"><div><h2>'+r.name+'</h2><p class="muted">标准出品：'+r.out+' · '+r.kind+'</p></div><button class="close" data-close>关闭</button></div><h3>食材</h3>'+r.ingredients.map(x=>'<div class="ingredient"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join('')+'<h3>步骤</h3><ol class="steps">'+r.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'; }document.querySelector('#recipeModal').classList.add('show');document.querySelector('#recipeDetail [data-close]').onclick=closeModals}
    function renderLibrary(){const q=document.querySelector('#librarySearch').value;document.querySelector('#libraryCards').innerHTML=filter(q).map(r=>'<button class="recipe" data-library="'+r.id+'"><strong>'+r.name+'</strong><small>'+r.kind+(r.mode?' · 直接安排':' · '+r.out)+'</small><span class="tag">'+(r.mode?'用餐方式':'查看食材与步骤')+'</span></button>').join('');document.querySelectorAll('[data-library]').forEach(b=>b.onclick=()=>openRecipe(find(b.dataset.library)))}
    function renderWant(){const q=document.querySelector('#wantSearch').value;const list=data.wants.map(find).filter(Boolean).filter(r=>!q||[r.name,r.aliases].join(' ').includes(q));document.querySelector('#wantCards').innerHTML=list.length?list.map(r=>'<button class="recipe" data-want-card="'+r.id+'"><strong>'+r.name+'</strong><small>已保存，尚未安排</small><span class="tag">点击安排到本周</span></button>').join(''):'<div class="empty">还没有想吃的餐食。搜索后点击“记录想吃的”。</div>';document.querySelectorAll('[data-want-card]').forEach(b=>b.onclick=()=>{activeSlot={date:days()[2],type:'晚餐'};openPicker(b.dataset.wantCard)})}
    function renderHistory(){const items=Object.keys(data.plans).sort().reverse();document.querySelector('#historyList').innerHTML=items.length?items.map(w=>{const count=Object.values(data.plans[w]).flat().length;return '<div class="history-row"><div><strong>'+w+' 所在周</strong><span>最终记录 · '+count+' 项餐食</span></div><button class="btn" data-history="'+w+'">查看这一周</button></div>'}).join(''):'<div class="panel empty">完成第一周计划后，它会永久出现在这里。</div>';document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{currentWeek=b.dataset.history;showTab('week');renderWeek()})}
    function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))} function showTab(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='library')renderLibrary();if(id==='want')renderWant();if(id==='history')renderHistory()}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);document.querySelector('#addMeal').onclick=()=>{activeSlot={date:days()[2],type:'晚餐'};openPicker()};document.querySelector('#pickerSearch').oninput=e=>renderPicker(filter(e.target.value));document.querySelector('#librarySearch').oninput=renderLibrary;document.querySelector('#wantSearch').oninput=renderWant;
    document.querySelector('#saveWant').onclick=()=>{const q=document.querySelector('#wantSearch').value;const candidates=filter(q);if(!candidates.length){alert('暂未找到这道菜；正式版会将它保存为“待 AI 补全”。');return}const id=candidates[0].id;if(!data.wants.includes(id))data.wants.push(id);save();renderWant();notify('已保存到想吃清单。')};document.querySelector('#copyWeek').onclick=()=>{const d=new Date(currentWeek+'T00:00:00');d.setDate(d.getDate()-7);const prev=d.toISOString().slice(0,10);if(!data.plans[prev]){notify('上周还没有菜单可复制。');return}data.plans[currentWeek]=JSON.parse(JSON.stringify(data.plans[prev]));save();renderWeek();notify('已复制上周菜单，可以逐项修改。')};document.querySelector('#clearWeek').onclick=()=>{if(undoPlan){data.plans[currentWeek]=undoPlan;undoPlan=null;save();renderWeek();notify('已撤销清空。');return}undoPlan=JSON.parse(JSON.stringify(plan()));data.plans[currentWeek]={};save();renderWeek();document.querySelector('#clearWeek').textContent='撤销清空';notify('已清空本周；点击“撤销清空”可恢复。');setTimeout(()=>{undoPlan=null;document.querySelector('#clearWeek').textContent='一键清空'},8000)};
    document.querySelector('#shareButton').onclick=()=>document.querySelector('#shareModal').classList.add('show');document.querySelector('#copyCode').onclick=e=>{e.target.textContent='已复制';};renderWeek();renderLibrary();
  </script>
</body>
</html>
